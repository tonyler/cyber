<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>{% block title %}Cybernetics{% endblock %}</title>
  <link rel="icon" type="image/jpeg" href="https://pbs.twimg.com/profile_images/1638268090738790414/1D0MzQX2_400x400.jpg">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans:    ['Space Grotesk', 'system-ui', 'sans-serif'],
            mono:    ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
</head>
<body>

  <!-- Ambient layers -->
  <div class="ambient-grid"></div>
  <div class="ambient-orb-1"></div>
  <div class="ambient-orb-2"></div>
  <div class="ambient-orb-3"></div>
  <div class="noise-layer"></div>

  <!-- Navigation -->
  <nav class="h-nav">
    <div class="h-nav-inner">

      <!-- Logo -->
      <a href="{{ url_for('index') }}" class="h-logo-wrap hidden sm:flex">
        <img src="https://pbs.twimg.com/profile_images/1638268090738790414/1D0MzQX2_400x400.jpg"
             alt="Cybernetics" style="width:34px;height:34px;border-radius:8px;object-fit:cover;flex-shrink:0;">
        <span class="h-brand hidden sm:block">Cybernetics</span>
      </a>

      <!-- Desktop links -->
      <div class="h-nav-links">
        <a href="{{ url_for('index') }}" class="h-nav-link {% if request.endpoint == 'index' %}active{% endif %}">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
          </svg>
          Dashboard
        </a>
        <a href="{{ url_for('members') }}" class="h-nav-link {% if request.endpoint == 'members' %}active{% endif %}">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
          Members
        </a>
        <a href="{{ url_for('activity') }}" class="h-nav-link {% if request.endpoint == 'activity' %}active{% endif %}">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/>
          </svg>
          Activity
        </a>
        <a href="{{ url_for('calendar') }}" class="h-nav-link {% if request.endpoint == 'calendar' %}active{% endif %}">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
          </svg>
          Calendar
        </a>
      </div>

      <!-- User -->
      <div class="h-nav-user">
        {% if current_user %}
        <img src="{{ current_user.avatar_url }}" alt="{{ current_user.username }}" class="hidden sm:block">
        <span class="h-nav-username hidden md:block">{{ current_user.username }}</span>
        {% endif %}
        <button id="mobile-menu-btn" class="h-mobile-btn" aria-label="Menu">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Mobile drawer -->
    <div id="mobile-menu" class="h-mobile-menu">
      <a href="{{ url_for('index') }}"    class="h-mobile-link {% if request.endpoint == 'index' %}active{% endif %}">Dashboard</a>
      <a href="{{ url_for('members') }}"  class="h-mobile-link {% if request.endpoint == 'members' %}active{% endif %}">Members</a>
      <a href="{{ url_for('activity') }}" class="h-mobile-link {% if request.endpoint == 'activity' %}active{% endif %}">Activity</a>
      <a href="{{ url_for('calendar') }}" class="h-mobile-link {% if request.endpoint == 'calendar' %}active{% endif %}">Calendar</a>
      {% if current_user %}
      <div class="h-mobile-user">
        <div class="h-mobile-user-info">
          <img src="{{ current_user.avatar_url }}" alt="{{ current_user.username }}">
          <span>{{ current_user.username }}</span>
        </div>
      </div>
      {% endif %}
    </div>
  </nav>

  <!-- Main -->
  <main class="relative z-10 w-full px-4 sm:px-6 lg:px-10 xl:px-14 py-8 sm:py-10">
    {% block content %}{% endblock %}
  </main>


  <script>window.CYBER_BASE_URL = "{{ url_for('index') }}".replace(/\/$/, '');</script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
