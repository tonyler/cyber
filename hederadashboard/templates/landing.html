<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cybernetics — Sign In</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;">

  <div class="ambient-grid"></div>
  <div class="ambient-orb-1"></div>
  <div class="ambient-orb-2"></div>
  <div class="noise-layer"></div>

  <div class="relative z-10 text-center" style="max-width:420px;padding:2rem;">

    <!-- Logo -->
    <div style="width:64px;height:64px;border-radius:16px;background:var(--ind-mid);border:1px solid var(--ind-border);
                box-shadow:var(--ind-glow);display:flex;align-items:center;justify-content:center;margin:0 auto 2rem;">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="color:var(--ind-text);">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
      </svg>
    </div>

    <h1 style="font-size:2.2rem;font-weight:700;color:var(--tx-hi);letter-spacing:-0.03em;margin:0 0 0.5rem;">Cybernetics</h1>
    <p style="font-size:0.9rem;color:var(--tx-dim);margin-bottom:2.5rem;line-height:1.6;">
      Sign in via Discord to continue.
    </p>

    <a href="{{ login_url }}"
       style="display:inline-flex;align-items:center;gap:0.75rem;padding:0.85rem 2rem;
              background:var(--ind-mid);border:1px solid var(--ind-border);border-radius:10px;
              color:var(--ind-text);text-decoration:none;font-weight:600;font-size:0.9rem;
              transition:all 0.2s;box-shadow:var(--ind-glow);"
       onmouseover="this.style.background='var(--ind-hi)';this.style.boxShadow='0 0 32px rgba(99,102,241,0.3)'"
       onmouseout="this.style.background='var(--ind-mid)';this.style.boxShadow='var(--ind-glow)'">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057.1 18.08.114 18.1.133 18.115a19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
      </svg>
      Sign in with Discord
    </a>

    <p style="margin-top:2rem;font-family:'JetBrains Mono',monospace;font-size:0.65rem;
              letter-spacing:0.12em;text-transform:uppercase;color:var(--tx-lo);">
      Requires "Loop 🎩" role
    </p>
  </div>

</body>
</html>
